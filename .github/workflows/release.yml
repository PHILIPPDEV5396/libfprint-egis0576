name: Release packages

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the publish job below elevates to contents:
# write, scoped to that job alone, to attach release assets.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-tag:
    name: Verify tag matches package pins
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Confirm the spec, PKGBUILD and both changelogs are pinned to this tag
        run: |
          TAG="${GITHUB_REF_NAME}"

          spec_tag=$(grep -oP '(?<=%global egis_tag )\S+' packaging/fedora/libfprint.spec)

          # PKGBUILD's source= array pins two different tags: the upstream
          # libfprint checkout (#tag=v${pkgver}, a shell variable, never a
          # literal driver tag) and this driver's own checkout. A plain
          # grep -oP '(?<=#tag=)[^"]+' over the whole file matches whichever
          # #tag= comes first, which is the upstream libfprint line, not
          # ours, so it is scoped to the libfprint-egis0576 source entry.
          pkgbuild_tag=$(grep 'libfprint-egis0576' packaging/aur/PKGBUILD | grep -oP '(?<=#tag=)[^"]+')

          # debian/changelog's revision carries the driver tag as
          # "-99egis<version>" (e.g. -99egis0.4.5 for tag v0.4.5), the same
          # way the spec's Release carries "egisN". Read it straight off the
          # top changelog stanza's "(version)" (no dpkg-dev on this runner)
          # and compare against the tag with its leading "v" stripped.
          changelog_version=$(head -1 packaging/debian/changelog | grep -oP '(?<=\()[^)]+(?=\))')
          changelog_egis_version=$(echo "$changelog_version" | grep -oP '(?<=-99egis)[0-9.]+$')
          tag_version="${TAG#v}"

          # packaging/ubuntu-tod/debian/changelog is a native package
          # (debian/source/format is "3.0 (native)"), so its version
          # carries no Debian revision and no "-99egis" suffix: the whole
          # "(version)" on the top stanza is the driver version, compared
          # against the tag directly.
          tod_changelog_version=$(head -1 packaging/ubuntu-tod/debian/changelog | grep -oP '(?<=\()[^)]+(?=\))')

          fail=0
          if [ "$spec_tag" != "$TAG" ]; then
            echo "FAIL: packaging/fedora/libfprint.spec sets %global egis_tag $spec_tag, but the pushed tag is $TAG"
            fail=1
          fi
          if [ "$pkgbuild_tag" != "$TAG" ]; then
            echo "FAIL: packaging/aur/PKGBUILD pins #tag=$pkgbuild_tag, but the pushed tag is $TAG"
            fail=1
          fi
          if [ "$changelog_egis_version" != "$tag_version" ]; then
            echo "FAIL: packaging/debian/changelog's revision pins driver version $changelog_egis_version, but the pushed tag is $TAG"
            fail=1
          fi
          if [ "$tod_changelog_version" != "$tag_version" ]; then
            echo "FAIL: packaging/ubuntu-tod/debian/changelog pins driver version $tod_changelog_version, but the pushed tag is $TAG"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1

          echo "All four packaging pins match tag $TAG."

  build:
    name: Build (${{ matrix.distro }})
    needs: verify-tag
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Container images stay pinned by tag, not by digest, unlike the
      # actions below. Digest-pinning fedora:43 or archlinux:latest would
      # freeze out routine distro package updates (security fixes included)
      # between releases; the tradeoff is that a compromised upstream image
      # could run here, which the actions/* pins below guard against for
      # the one job that holds contents: write.
      matrix:
        include:
          - distro: fedora
            container: fedora:43
          - distro: archlinux
            container: archlinux:latest
          - distro: debian
            container: debian:trixie
          - distro: ubuntu-noble
            container: ubuntu:noble
            series: noble
            series_version: '24.04'
          - distro: ubuntu-resolute
            container: ubuntu:26.04
            series: resolute
            series_version: '26.04'
    container:
      image: ${{ matrix.container }}
    steps:
      # actions/checkout@v4 needs `git` in the container. Neither fedora:43 nor
      # archlinux:latest ships it, and without it checkout silently falls back
      # to downloading a tarball of the ref through the REST API instead of
      # running `git clone` (see actions/checkout's runtime fallback for
      # environments with no git binary). That fallback would still produce a
      # correct checkout of the tag, but it is undocumented behavior to rely
      # on, so install git explicitly and get a real `git clone` instead.
      - name: Install git (Fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y git

      - name: Install git (Arch)
        if: matrix.distro == 'archlinux'
        run: pacman -Sy --noconfirm git

      - name: Install git (Debian)
        if: matrix.distro == 'debian'
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Install git (Ubuntu)
        if: startsWith(matrix.distro, 'ubuntu-')
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout (tag)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # --- Fedora path ---
      - name: Install Fedora build deps
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y rpmdevtools rpm-build 'dnf-command(builddep)' dnf-plugins-core
          rpmdev-setuptree

      - name: Build Fedora RPM
        if: matrix.distro == 'fedora'
        run: |
          cp packaging/fedora/libfprint.spec ~/rpmbuild/SPECS/
          cd ~/rpmbuild/SPECS
          spectool -g -R libfprint.spec
          dnf builddep -y libfprint.spec
          rpmbuild -ba libfprint.spec
          mkdir -p "$GITHUB_WORKSPACE/dist"
          find ~/rpmbuild/RPMS ~/rpmbuild/SRPMS -type f -exec cp {} "$GITHUB_WORKSPACE/dist/" \;

      # Fedora ships its own libfprint, so this step installs the stock package
      # first. That way the next step proves a real replacement of an existing
      # package, not just a first install into an empty container.
      - name: Install stock Fedora libfprint
        if: matrix.distro == 'fedora'
        run: dnf install -y libfprint

      - name: Install and verify the rebuilt Fedora RPM
        if: matrix.distro == 'fedora'
        run: |
          cd "$GITHUB_WORKSPACE"

          # The main package file only (excludes -devel, -tests, -debuginfo,
          # -debugsource and the .src.rpm, none of which this check needs).
          rpm_file=$(ls dist/libfprint-[0-9]*.x86_64.rpm)

          # Plain `dnf install` of the local RPM was tested against a
          # container with Fedora's stock libfprint already installed, and it
          # replaced it with no extra flag: our Release field
          # (99<dist>.egis9) sorts above Fedora's own (1.fcNN), so dnf reads
          # the local RPM as a normal upgrade. No --allowerasing needed.
          dnf install -y "$rpm_file"

          # Read the expected Version-Release out of the spec itself (with
          # rpmspec resolving %{egis_tag} and %{?dist} the same way rpmbuild
          # did to produce $rpm_file) instead of hardcoding it here, so this
          # check tracks the spec instead of drifting from it on every driver
          # release. Note what this does and does not tie together: %{egis_tag}
          # appears only in Source10, so Version-Release carries the upstream
          # libfprint version and the Release suffix, never the driver tag.
          # This step therefore ties the installed RPM to the packaging file it
          # was built from; verify-tag separately ties that file's egis_tag to
          # the pushed tag. Two independent pins, not one chain.
          expected_version=$(rpmspec -q --qf '%{VERSION}-%{RELEASE}\n' packaging/fedora/libfprint.spec | head -1)
          test -n "$expected_version" || {
            echo "FAIL: could not read a Version-Release out of packaging/fedora/libfprint.spec"; exit 1;
          }
          installed_version=$(rpm -q --qf '%{VERSION}-%{RELEASE}\n' libfprint)
          echo "== installed package version =="
          echo "$installed_version"
          test "$installed_version" = "$expected_version" || {
            echo "FAIL: installed libfprint is $installed_version, expected $expected_version (from packaging/fedora/libfprint.spec)"; exit 1;
          }

          echo "== libfprint-2.so.2 at the Fedora library path =="
          test -e /usr/lib64/libfprint-2.so.2 || {
            echo "FAIL: /usr/lib64/libfprint-2.so.2 missing"; exit 1;
          }
          soname_target=$(readlink -f /usr/lib64/libfprint-2.so.2)
          test -s "$soname_target" || {
            echo "FAIL: $soname_target is missing or empty"; exit 1;
          }

          echo "== egis0576 driver compiled into the installed library =="
          # A driver name string could appear from an unrelated source string
          # table, so require several distinct egis0576 symbol names, not one
          # substring match.
          hits=$(strings "$soname_target" | grep -c 'egis0576' || true)
          test "$hits" -ge 5 || {
            echo "FAIL: only $hits egis0576 references in the installed .so, expected several"; exit 1;
          }
          strings "$soname_target" | grep -q '^FpDeviceEgis0576$' || {
            echo "FAIL: FpDeviceEgis0576 type name not found in the installed .so"; exit 1;
          }

          echo "== systemd-sleep hook =="
          hook=/usr/lib/systemd/system-sleep/50-egis0576-fp-resume.sh
          test -x "$hook" || { echo "FAIL: $hook missing or not executable"; exit 1; }
          grep -q 'systemctl.*fprintd' "$hook" || {
            echo "FAIL: $hook does not stop/start fprintd, wrong file installed"; exit 1;
          }

          echo "== udev rule =="
          rule=/usr/lib/udev/rules.d/60-egis0576-fp-nosuspend.rules
          test -s "$rule" || { echo "FAIL: $rule missing or empty"; exit 1; }
          grep -q '^ACTION==.*1c7a.*0576' "$rule" || {
            echo "FAIL: $rule has no ACTION rule matching the 1c7a:0576 USB ID"; exit 1;
          }

          echo "Fedora install verification passed."

      # --- Arch path ---
      - name: Install Arch build deps
        if: matrix.distro == 'archlinux'
        run: |
          # NOTE on pacman's seccomp sandbox: pacman >= 7.0 runs its
          # transaction hooks under a seccomp() sandbox. That sandbox call
          # fails under qemu-x86_64 user-mode emulation (confirmed while
          # proving this workflow on an arm64 Mac), which is why an
          # earlier draft of this job disabled it with `DisableSandbox` in
          # /etc/pacman.conf. This job runs archlinux:latest natively on a
          # GitHub-hosted x86_64 runner, with no emulation layer, so that
          # failure mode should not apply here. Confirmed: a tag pushed to
          # a fork ran this job end to end and both the Fedora and Arch
          # legs passed with the sandbox left enabled -- if a future run
          # fails with "error restricting syscalls via seccomp", add back:
          #   sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel meson glib2 glib2-devel \
            gobject-introspection python-gobject python-cairo systemd \
            libgudev libgusb openssl pixman

      - name: Build Arch package
        if: matrix.distro == 'archlinux'
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/aur' && makepkg -s --noconfirm"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp packaging/aur/*.pkg.tar.* "$GITHUB_WORKSPACE/dist/"

      # Arch ships its own libfprint, so this step installs the stock package
      # first, the same way the Fedora leg does above. That way the next step
      # proves a real replacement (exercising the PKGBUILD's `conflicts` and
      # `provides` handling), not just a first install into an empty container.
      - name: Install stock Arch libfprint
        if: matrix.distro == 'archlinux'
        run: pacman -S --noconfirm libfprint

      - name: Install and verify the Arch package
        if: matrix.distro == 'archlinux'
        run: |
          cd "$GITHUB_WORKSPACE"

          # The main package file only (excludes the *-debug package).
          pkg_file=$(ls dist/libfprint-egis0576-[0-9]*.pkg.tar.*)

          # pacman -U --noconfirm does NOT auto-answer the "in conflict,
          # remove libfprint? [y/N]" question -- that prompt defaults to
          # No even under --noconfirm, so a plain -U here fails with
          # "unresolvable package conflicts detected" (confirmed while
          # proving this workflow). Remove the stock package first, then
          # install the replacement; this still proves the `conflicts` and
          # `provides` fields in the PKGBUILD produce an installable
          # replacement, since pacman resolves the runtime deps for it from
          # the sync databases refreshed by the build-deps step above.
          pacman -R --noconfirm libfprint
          pacman -U --noconfirm "$pkg_file"

          # Read the expected pkgver-pkgrel out of the PKGBUILD itself instead
          # of hardcoding it here, so this check tracks the PKGBUILD instead of
          # drifting from it on every driver release. As on the Fedora leg,
          # pkgver/pkgrel are the upstream libfprint version, not the driver
          # tag: this ties the installed package to the PKGBUILD, and verify-tag
          # separately ties the PKGBUILD's #tag= pin to the pushed tag.
          # \S+ then strip quotes, so both pkgver=1.2.3 and pkgver="1.2.3"
          # (both legal) read correctly instead of false-failing the release.
          pkgver_raw=$(grep -oP '^pkgver=\K\S+' packaging/aur/PKGBUILD)
          pkgrel_raw=$(grep -oP '^pkgrel=\K\S+' packaging/aur/PKGBUILD)
          pkgver_val=${pkgver_raw//\"/}
          pkgrel_val=${pkgrel_raw//\"/}
          test -n "$pkgver_val" -a -n "$pkgrel_val" || {
            echo "FAIL: could not read pkgver/pkgrel out of packaging/aur/PKGBUILD"; exit 1;
          }
          expected_version="$pkgver_val-$pkgrel_val"
          installed_version=$(pacman -Q libfprint-egis0576 | awk '{print $2}')
          echo "== installed package version =="
          echo "$installed_version"
          test "$installed_version" = "$expected_version" || {
            echo "FAIL: installed libfprint-egis0576 is $installed_version, expected $expected_version (from packaging/aur/PKGBUILD)"; exit 1;
          }

          echo "== libfprint-2.so.2 at the Arch library path =="
          test -e /usr/lib/libfprint-2.so.2 || {
            echo "FAIL: /usr/lib/libfprint-2.so.2 missing"; exit 1;
          }
          soname_target=$(readlink -f /usr/lib/libfprint-2.so.2)
          test -s "$soname_target" || {
            echo "FAIL: $soname_target is missing or empty"; exit 1;
          }

          echo "== egis0576 driver compiled into the installed library =="
          hits=$(strings "$soname_target" | grep -c 'egis0576' || true)
          test "$hits" -ge 5 || {
            echo "FAIL: only $hits egis0576 references in the installed .so, expected several"; exit 1;
          }
          strings "$soname_target" | grep -q '^FpDeviceEgis0576$' || {
            echo "FAIL: FpDeviceEgis0576 type name not found in the installed .so"; exit 1;
          }

          # The PKGBUILD deliberately ships no systemd-sleep hook and no
          # egis0576 udev rule (see packaging/aur/PKGBUILD), unlike the
          # Fedora spec. Confirm that stays true, so a future PKGBUILD change
          # that starts shipping them does not go unnoticed here.
          echo "== confirm the sleep hook and udev rule are absent, as intended =="
          test ! -e /usr/lib/systemd/system-sleep/50-egis0576-fp-resume.sh || {
            echo "FAIL: unexpected systemd-sleep hook in the Arch package"; exit 1;
          }
          test ! -e /usr/lib/udev/rules.d/60-egis0576-fp-nosuspend.rules || {
            echo "FAIL: unexpected udev rule in the Arch package"; exit 1;
          }

          echo "Arch install verification passed."

      # --- Debian path ---
      - name: Install Debian build deps
        if: matrix.distro == 'debian'
        run: |
          apt-get install -y --no-install-recommends dpkg-dev

          # apt-get build-dep looks for <dir>/debian/control, so it is pointed
          # at packaging/ (the parent of packaging/debian, which plays the
          # role of that debian/ subdirectory), the same way
          # packaging/README.md documents for a local build.
          apt-get build-dep -y ./packaging

      - name: Build Debian packages
        if: matrix.distro == 'debian'
        run: |
          bash packaging/debian/build.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Prefixed with the tested Debian codename so a Debian package
          # cannot be mistaken for one of the per-series Ubuntu packages a
          # later leg attaches to the same release.
          for f in packaging/debian/build-output/*.deb \
                   packaging/debian/build-output/*.changes \
                   packaging/debian/build-output/*.buildinfo; do
            cp "$f" "$GITHUB_WORKSPACE/dist/debian-trixie-$(basename "$f")"
          done

      # Debian trixie ships its own libfprint-2-2, so this step installs the
      # stock package first. That way the next step proves a real
      # replacement of an existing package, not just a first install into an
      # empty container.
      - name: Install stock Debian libfprint-2-2
        if: matrix.distro == 'debian'
        run: apt-get install -y libfprint-2-2

      - name: Install and verify the rebuilt Debian package
        if: matrix.distro == 'debian'
        # This container's default step shell is dash (/bin/sh), which
        # does not support the <<< here-string below; bash is needed.
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          lib_deb=$(ls packaging/debian/build-output/libfprint-2-2_*.deb)
          dev_deb=$(ls packaging/debian/build-output/libfprint-2-dev_*.deb)
          gir_deb=$(ls packaging/debian/build-output/gir1.2-fprint-2.0_*.deb)

          # All three installed together: libfprint-2-dev and
          # gir1.2-fprint-2.0 both Depend on libfprint-2-2 at an exact
          # matching version. `apt install ./*.deb` resolves the remaining
          # runtime deps from the container's own repos.
          #
          # No --allow-downgrades: the changelog carries epoch "1:", the
          # same epoch Debian trixie's stock libfprint-2-2 (1:1.94.9-1)
          # carries, so this build's version (1:1.94.100-99egis1) sorts
          # above the stock package on version alone. See
          # packaging/README.md, "Maintainer" section.
          apt-get install -y "./$lib_deb" "./$dev_deb" "./$gir_deb"

          # Read the expected version out of the changelog instead of
          # hardcoding the revision here, so this check tracks the changelog
          # instead of drifting from it on every driver release.
          expected_version=$(dpkg-parsechangelog -l packaging/debian/changelog --show-field Version)
          test -n "$expected_version" || {
            echo "FAIL: could not read a Version out of packaging/debian/changelog"; exit 1;
          }
          installed_version=$(dpkg-query -W -f='${Version}\n' libfprint-2-2)
          echo "== installed package version =="
          echo "$installed_version"
          test "$installed_version" = "$expected_version" || {
            echo "FAIL: installed libfprint-2-2 is $installed_version, expected $expected_version (from packaging/debian/changelog)"; exit 1;
          }

          echo "== libfprint-2.so.2 at the Debian multiarch path =="
          soname="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/libfprint-2.so.2"
          test -e "$soname" || { echo "FAIL: $soname missing"; exit 1; }
          soname_target=$(readlink -f "$soname")
          test -s "$soname_target" || {
            echo "FAIL: $soname_target is missing or empty"; exit 1;
          }

          echo "== egis0576 driver compiled into the installed library =="
          # Captured once, up front: `strings` piped straight into `grep -q`
          # races under pipefail on a large binary. `grep -q` exits on the
          # first match while `strings` is still writing, and once its
          # output exceeds the pipe buffer `strings` blocks on write() and
          # gets SIGPIPE, so pipefail can fail the pipeline even though the
          # match was found. Confirmed while proving this leg locally.
          lib_strings=$(strings "$soname_target")

          # A driver name string could appear from an unrelated source string
          # table, so require several distinct egis0576 symbol names, not one
          # substring match.
          hits=$(grep -c 'egis0576' <<<"$lib_strings" || true)
          test "$hits" -ge 5 || {
            echo "FAIL: only $hits egis0576 references in the installed .so, expected several"; exit 1;
          }
          grep -q '^FpDeviceEgis0576$' <<<"$lib_strings" || {
            echo "FAIL: FpDeviceEgis0576 type name not found in the installed .so"; exit 1;
          }

          echo "== systemd-sleep hook =="
          hook=/usr/lib/systemd/system-sleep/50-egis0576-fp-resume.sh
          test -x "$hook" || { echo "FAIL: $hook missing or not executable"; exit 1; }
          grep -q 'systemctl.*fprintd' "$hook" || {
            echo "FAIL: $hook does not stop/start fprintd, wrong file installed"; exit 1;
          }

          echo "== udev rule =="
          rule=/usr/lib/udev/rules.d/60-egis0576-fp-nosuspend.rules
          test -s "$rule" || { echo "FAIL: $rule missing or empty"; exit 1; }
          grep -q '^ACTION==.*1c7a.*0576' "$rule" || {
            echo "FAIL: $rule has no ACTION rule matching the 1c7a:0576 USB ID"; exit 1;
          }

          echo "Debian install verification passed."

      # --- Ubuntu TOD module path ---
      - name: Install Ubuntu build deps
        if: startsWith(matrix.distro, 'ubuntu-')
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends build-essential devscripts \
            debhelper meson pkgconf libfprint-2-tod-dev libfprint-2-dev \
            libgusb-dev libglib2.0-dev

      - name: Build Ubuntu package (${{ matrix.series }})
        if: startsWith(matrix.distro, 'ubuntu-')
        run: |
          cd "$GITHUB_WORKSPACE/packaging/ubuntu-tod"
          ./build-series.sh "${{ matrix.series }}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          # Prefixed with "ubuntu-<series>-" so a package for one series
          # cannot be mistaken for the other series' package, or for the
          # debian-trixie-prefixed Debian package on the same release, on
          # the Releases page. The ~24.04 / ~26.04 in the version itself
          # (see build-series.sh) is what actually keeps the two Ubuntu
          # packages installable side by side and sorting correctly across
          # a release upgrade; the filename prefix is only for a human
          # scanning the release assets.
          for f in build-output/*.deb \
                   build-output/*.ddeb \
                   build-output/*.changes \
                   build-output/*.buildinfo; do
            [ -e "$f" ] || continue
            cp "$f" "$GITHUB_WORKSPACE/dist/ubuntu-${{ matrix.series }}-$(basename "$f")"
          done

      # Ubuntu ships its own libfprint-2-2 (which the TOD module never
      # touches), so this step installs the stock package first. That way
      # the later dpkg -V comparison has a real baseline to compare against,
      # not just an empty container.
      - name: Install stock Ubuntu libfprint-2-2 (${{ matrix.series }})
        if: startsWith(matrix.distro, 'ubuntu-')
        run: apt-get install -y libfprint-2-2

      - name: Install and verify the Ubuntu package (${{ matrix.series }})
        if: startsWith(matrix.distro, 'ubuntu-')
        # This container's default step shell is dash (/bin/sh), which
        # does not support the <<< here-string below; bash is needed.
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"

          deb=$(ls dist/ubuntu-${{ matrix.series }}-libfprint-2-tod1-egis0576_*.deb)

          echo "== dpkg -V libfprint-2-2, before installing the TOD module =="
          before=$(dpkg -V libfprint-2-2 || true)

          # Plain apt install, no --allow-downgrades, no --force-depends: the
          # .deb was built inside this same container image, so its
          # auto-generated ${shlibs:Depends} (in particular libgusb2 vs.
          # libgusb2a) already matches what this series ships.
          apt-get install -y "./$deb"

          # Expected version is the tag with its leading "v" stripped, plus
          # this series' suffix, e.g. tag v0.4.5 on resolute -> 0.4.5~26.04.
          # Read straight off the tag rather than hardcoding it here, the
          # same way the Debian leg reads its expected version out of
          # packaging/debian/changelog instead of hardcoding it.
          expected_version="${GITHUB_REF_NAME#v}~${{ matrix.series_version }}"
          installed_version=$(dpkg-query -W -f='${Version}\n' libfprint-2-tod1-egis0576)
          echo "== installed package version =="
          echo "$installed_version"
          test "$installed_version" = "$expected_version" || {
            echo "FAIL: installed libfprint-2-tod1-egis0576 is $installed_version, expected $expected_version (from tag $GITHUB_REF_NAME)"; exit 1;
          }

          echo "== module installed under the TOD drivers directory pkg-config reports =="
          tod_dir=$(pkg-config --variable=tod_driversdir libfprint-2-tod-1)
          test -n "$tod_dir" || { echo "FAIL: pkg-config reported no tod_driversdir"; exit 1; }
          module="$tod_dir/libfprint-tod-egis0576.so"
          test -e "$module" || { echo "FAIL: $module not installed"; exit 1; }

          echo "== module file name satisfies the TOD loader's lib*.so rule =="
          # tod-shared-loader.c only opens files that both start with "lib"
          # and end in ".so" (see packaging/README.md). Checking the pattern,
          # not just the one name this build happens to produce, so a future
          # change to a versioned .so.N.N.N name would be caught here too.
          base=$(basename "$module")
          case "$base" in
            lib*.so) ;;
            *) echo "FAIL: $base does not match the loader's lib*.so naming rule"; exit 1 ;;
          esac

          echo "== dpkg -V libfprint-2-2, after installing the TOD module =="
          after=$(dpkg -V libfprint-2-2 || true)
          if [ "$before" != "$after" ]; then
            echo "FAIL: dpkg -V libfprint-2-2 changed after installing the TOD module"
            echo "-- before --"
            echo "$before"
            echo "-- after --"
            echo "$after"
            exit 1
          fi
          echo "dpkg -V libfprint-2-2 unchanged, as expected."

          echo "== stock libfprint loads the module =="
          # A five-line program that only creates an FpContext. libfprint-2-dev
          # (a build dep above) provides the header and pkg-config file; no
          # extra package is needed to compile it.
          cat > /tmp/probe.c <<'PROBE_EOF'
          #include <fprint.h>

          int
          main (void)
          {
            g_autoptr (FpContext) ctx = fp_context_new ();
            GPtrArray *devs = fp_context_get_devices (ctx);

            g_print ("context created, %u device(s) present\n", devs ? devs->len : 0);
            return 0;
          }
          PROBE_EOF
          # pkg-config's output is meant to be word-split into several
          # separate flags, so it is deliberately left unquoted here.
          # shellcheck disable=SC2046
          gcc /tmp/probe.c -o /tmp/probe $(pkg-config --cflags --libs libfprint-2)

          probe_output=$(G_MESSAGES_DEBUG=all /tmp/probe 2>&1)
          echo "$probe_output"
          grep -q 'Loading driver egis0576' <<<"$probe_output" || {
            echo "FAIL: stock libfprint did not report loading driver egis0576"; exit 1;
          }

          echo "Ubuntu (${{ matrix.series }}) install verification passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.distro }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach artifacts to release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Full history, so the ancestor check below can see the default branch.
      - name: Checkout (for the default-branch ancestor check)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Determine whether to publish or draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          git fetch --no-tags origin "$default_branch"

          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/$default_branch"; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME points at a commit on $default_branch. Publishing normally."
          else
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "Tag $GITHUB_REF_NAME points at a commit not on $default_branch. Creating a draft release, not a published one."
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: packages-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist

          # GitHub release assets cannot contain "~" (the Ubuntu .deb,
          # .buildinfo and .changes filenames carry one, from the
          # ~24.04/~26.04 series suffix in build-series.sh); gh release
          # create/upload silently renames "~" to "." on upload. Rename
          # here, before hashing, so SHA256SUMS records the same names
          # the release ends up serving, not the pre-upload ones.
          for f in *'~'*; do
            [ -e "$f" ] || continue
            mv -- "$f" "${f//\~/.}"
          done

          sha256sum -- * > SHA256SUMS

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRAFT: ${{ steps.draft.outputs.draft }}
        run: |
          TAG="${GITHUB_REF_NAME}"

          draft_flag=()
          if [ "$IS_DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes "${draft_flag[@]}"
          fi
