# systemd drop-in for fprintd.service: do not start while the EgisTec EH576 is
# being re-enumerated by the resume hook. See integration/README.md and
# egis0576-fp-wait for what this closes and why it is fail-open.
#
# Installs to /usr/lib/systemd/system/fprintd.service.d/ (packages) or
# /etc/systemd/system/fprintd.service.d/ (install.sh). Delete to revert.
[Service]
ExecStartPre=/usr/libexec/egis0576-fp-wait
